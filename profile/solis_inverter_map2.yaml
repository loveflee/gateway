  - {key: "battery_charge_energy_total", name: "總電池充電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "battery_discharge_energy_total", name: "總電池放電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "grid_import_energy_total", name: "總買電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "grid_export_energy_total", name: "總賣電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "load_consumption_energy_total", name: "總家用耗電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}

  - {key: "grid_fault_code", name: "市電故障碼", ha: {type: "sensor", icon: "mdi:alert", entity_category: "diagnostic"}}
  - {key: "backup_fault_code", name: "離網故障碼", ha: {type: "sensor", icon: "mdi:alert", entity_category: "diagnostic"}}
  - {key: "battery_fault_code", name: "電池故障碼", ha: {type: "sensor", icon: "mdi:alert", entity_category: "diagnostic"}}
