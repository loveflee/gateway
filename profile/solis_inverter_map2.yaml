  - {key: "today_energy", name: "今日發電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "yesterday_energy", name: "昨日發電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
  - {key: "month_energy", name: "本月發電量", unit: "kWh", ha: {type: "sensor", device_class: "energy", state_class: "total_increasing"}}
