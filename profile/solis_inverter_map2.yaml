  - {key: "inverter_fault_code_2", name: "逆變器故障碼2", ha: {type: "sensor", icon: "mdi:alert", entity_category: "diagnostic"}}
  - {key: "operating_status_bits", name: "運行狀態位元", ha: {type: "sensor", icon: "mdi:information-outline", entity_category: "diagnostic"}}
  - {key: "set_storage_control", name: "控制儲能原始值", ha: {type: "sensor", icon: "mdi:code-braces", entity_category: "diagnostic"}}
  - {key: "storage_control_mode", name: "儲能控制模式", ha: {type: "sensor", icon: "mdi:state-machine", entity_category: "diagnostic"}}
  - {key: "storage_control_modifiers", name: "儲能控制附加功能", ha: {type: "sensor", icon: "mdi:feature-search-outline", entity_category: "diagnostic"}}

B3_STATUS_BITS:
  stat_run_normal: {name: "正常運行中", ha: {type: "binary_sensor", icon: "mdi:check-circle", entity_category: "diagnostic"}}
  stat_run_fault: {name: "故障停機", ha: {type: "binary_sensor", device_class: "problem", entity_category: "diagnostic"}}

B2_SETTING:
  - key: "set_switch"
    name: "逆變器開關"
    ha: {type: "switch", icon: "mdi:power", payload_on: "190", payload_off: "222"}
  - key: "set_active_power_percent"
    name: "有功功率限制 (%)"
    ha: {type: "number", min: 0, max: 110, step: 1, mode: "slider", unit_of_measurement: "%", entity_category: "config"}
  - key: "set_batt_max_charge_c"
