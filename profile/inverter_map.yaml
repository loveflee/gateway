  - key: "batt_low_alarm"
    name: "電池低壓報警值"
    ha: {type: "number", min: 8, max: 15, mode: "box", state_key: "batt_low_alarm_fb"}

  - key: "batt_low_recover"
    name: "電池低壓報警恢復值"
    ha: {type: "number", min: 8, max: 15, mode: "box", state_key: "batt_low_recover_fb"}

  - key: "batt_low_resume"
    name: "電池低壓恢復值"
