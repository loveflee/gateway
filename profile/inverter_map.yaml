  - key: "device_id"
    name: "設備ID"
    ha: 
      type: "number"
      min: 1
      max: 247
      mode: "box"
      optimistic: true  # 💡 [防呆展示] 沒有 FB 狀態可以讀取，直接啟用盲猜模式

  - key: "combined_mode"
    name: "一體機模式"
    ha:
      type: "select"
      options: ["單機模式", "控制器模式", "MPPT模式"]
      icon: "mdi:server-network"
      state_key: "combined_mode_fb"

  # 遠程開關機 0x401B —— 手冊：FC 03(讀)/06(寫)/10(寫)，1=開機狀態、0=關機狀態
  # ⚠ 必須用 switch 而非 button：這是兩個穩定狀態的開關，且有回讀暫存器。
  #   button 只能送單一 payload_press，開得了關不了。
  # ⚠ key 必須與後端 settings 的 0x401B 條目一致（encode_write 是用 key 反查 settings），
  #   改成 set_remote_switch 之類會直接拋 ValueError: 未知的寫入 Key。
  - key: "remote_switch"
    name: "遠程開關機"
    ha:
      type: "switch"
      icon: "mdi:power"
      payload_on: "1"                  # 手冊 1=開機
      payload_off: "0"                 # 手冊 0=關機
      state_key: "remote_switch_fb"    # UI 顯示聽從回讀點，不做樂觀盲猜
