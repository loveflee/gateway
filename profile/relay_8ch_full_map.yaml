# HY-IO8800S 完整點位地圖（唯讀擴充版）— 依 report/051 盤點結果建立
#
# 狀態：已納入版控，**尚未啟用**。任何 config.yaml 的 devices 條目都沒有指向
#       本檔；驗證機 UID3 目前跑的仍是 relay_8ch_map2。放進 profile/ 之後會
#       出現在 WebUI 的 profile 下拉選單中（web_admin._discover_profiles()
#       掃描 profile/*.yaml），屬「可選但未選」，切換與否是現場決定。
#
# 寫入面：本檔不新增任何寫入目標。settings 只有原本 8 顆 FC05 relay，
#         B2_SETTING 只有 group_01／group_234 兩個 FC15 select。手冊標示為
#         RW 的 holding register（裝置位址、broadcast mode、輸出保持、
#         pulse 邊緣／防抖、心跳、Rule 參數等）在本檔一律只讀不寫，
#         要開放寫入必須另過一輪寫入安全審查 —— 其中 configured device
#         address 與 output state hold 會改變通訊目標與斷電後 DO 行為，
#         重啟／恢復出廠寄存器則永不映射到 HA。
#
# 證據等級：僅收錄 report/051 判定為 BOTH CONFIRMED 的點位（原廠手冊列出
#           且經 UID3 實機 FC01／FC02／FC03 唯讀回讀、由 production Adapter
#           成功解碼）。位址換算 protocol = PLC − 40001／− 10001／− 00001。
#
# 相關報告：051（點位盤點）、050（FC16 quantity=2 實機閉環，同一台 UID3）。

definitions:
  value_maps:
    broadcast_mode: {0: "off", 1: "receive_and_respond", 2: "receive_no_response"}
    output_state_hold: {0: "no_hold", 1: "hold_after_soft_restart", 2: "hold_after_soft_restart_and_power_loss"}
    pulse_count_edge: {0: "falling_edge", 1: "rising_edge"}
    enabled: {0: "off", 1: "on"}
    serial_parity: {0: "none", 1: "odd", 2: "even"}
    rule_mode:
      0: "disabled"
      1: "di_follow"
      2: "pulse_output"
      3: "delay_control"
      4: "timed_change"
      5: "cycle_change"
      6: "button"
      7: "schedule_once"
      8: "schedule_cycle"
      9: "daily_schedule"
      10: "ai_voltage_high"
      11: "ai_voltage_low"
      12: "ai_current_high"
      13: "ai_current_low"

read_commands:
  - {id: "read_coils", fc: 1, start_addr: 0, count: 8, response_len: 6}
  - {id: "read_discrete_inputs", fc: 2, start_addr: 0, count: 8, response_len: 6}
  - {id: "read_identity", fc: 3, start_addr: 0, count: 42, response_len: 89}
  - {id: "read_parameters", fc: 3, start_addr: 42, count: 51, response_len: 107}
  - {id: "read_rules_1_to_8", fc: 3, start_addr: 128, count: 64, response_len: 133}
  - {id: "read_di_pulse_counts", fc: 3, start_addr: 1280, count: 16, response_len: 37}

sensors:
  - key: "relay_status_byte"
    command_id: "read_coils"
    offset: 3
    length: 1
    bits:
      - {bit: 0, id: "switch_0", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 1, id: "switch_1", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 2, id: "switch_2", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 3, id: "switch_3", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 4, id: "switch_4", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 5, id: "switch_5", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 6, id: "switch_6", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 7, id: "switch_7", ha: {payload_on: "ON", payload_off: "OFF"}}
  - key: "di_status_byte"
    command_id: "read_discrete_inputs"
    offset: 3
    length: 1
    bits:
      - {bit: 0, id: "di_0", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 1, id: "di_1", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 2, id: "di_2", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 3, id: "di_3", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 4, id: "di_4", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 5, id: "di_5", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 6, id: "di_6", ha: {payload_on: "ON", payload_off: "OFF"}}
      - {bit: 7, id: "di_7", ha: {payload_on: "ON", payload_off: "OFF"}}

