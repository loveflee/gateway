  - key: "cell_07_voltage"
    name: "單體 07 電壓"
    unit: "V"
    ha: { type: "sensor", device_class: "voltage", state_class: "measurement", suggested_display_precision: 3 }
  - key: "cell_08_voltage"
    name: "單體 08 電壓"
    unit: "V"
