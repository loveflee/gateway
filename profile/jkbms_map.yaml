    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "discharge_sc_release_time"
    name: "放電短路解除計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "charge_ocp_release_time"
    name: "充電過流解除計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "charge_sc_release_time"
    name: "充電短路解除計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "cell_uvp_release_time"
    name: "單體欠壓解除計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "cell_ovp_release_time"
    name: "單體過壓解除計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }

  # ================= 6. 系統與時間設定 =================
