# =============================================================================
# jkbms_ha_map.yaml - V3.3.0 真・工控完全體版 (Industrial Production Ready)
# 適用：IronGate Gateway V3.9+ / jkbms_adapter.py V5.3+
# 鐵律：不刪減任何原廠參數；補齊所有警報 (Alarms)、允許狀態 (Enables) 與故障碼。
# =============================================================================

# -----------------------------------------------------------------------------
# ⚠ 為何有 34 個 key 帶 re_ 前綴（2026-08 加入，勿隨意還原）
#   這些實體曾經被誤標為 entity_category: config。HA 不允許唯讀 sensor/
#   binary_sensor 使用 config 分類，實體建立失敗後在 HA 註冊表留下孤兒項目，
#   永久佔住原本的 unique_id —— 刪裝置、重載 MQTT、清空 broker retained、
#   重啟 HA 全部無效（已逐一驗證）。
#   以全新 unique_id 發布可正常建立（探針實驗證實），故改用 re_ 前綴，
#   並以 value_template 指回原始資料 key，資料來源與 adapter 輸出完全不變。
# -----------------------------------------------------------------------------

B1_INFO:
  # ================= 電池核心即時數據 (主面板：V/A/W/SOC) =================
  - key: "total_voltage"
    name: "電池總電壓"
    unit: "V"
    ha: { type: "sensor", device_class: "voltage", state_class: "measurement", suggested_display_precision: 3 }
  - key: "current"
    name: "電池總電流"
    unit: "A"
    ha: { type: "sensor", device_class: "current", state_class: "measurement", suggested_display_precision: 3 }
  - key: "power_watts"
    name: "總功率"
    unit: "W"
    ha: { type: "sensor", device_class: "power", state_class: "measurement", suggested_display_precision: 0 }
  - key: "soc_percent"
    name: "剩餘電量"
    unit: "%"
    ha: { type: "sensor", device_class: "battery", state_class: "measurement" }
  - key: "remaining_capacity_ah"
    name: "剩餘容量"
    unit: "Ah"
    ha: { type: "sensor", state_class: "measurement", suggested_display_precision: 3 }

  # ================= 充放電狀態與實際允許機制 (Enables) =================
  - key: "charge_status"
    name: "充電狀態(電流)"
    ha: { type: "binary_sensor", device_class: "battery_charging", payload_on: "ON", payload_off: "OFF" }
  - key: "discharge_status"
    name: "放電狀態(電流)"
    ha: { type: "binary_sensor", device_class: "power", payload_on: "ON", payload_off: "OFF" }
  # [必補] BMS 實際允許狀態 (對應 MOS 真實導通情形，非使用者設定值)
  - key: "charge_enable"
    name: "允許充電 (MOS狀態)"
    ha: { type: "binary_sensor", device_class: "power", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }
  - key: "discharge_enable"
    name: "允許放電 (MOS狀態)"
    ha: { type: "binary_sensor", device_class: "power", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }

  # ================= 故障與狀態碼總覽 (全局除錯用) =================
  - key: "fault_code"
    name: "故障碼 (Fault Code)"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "status_code"
    name: "狀態碼 (Status Code)"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "soc_calibration_state"
    name: "SOC 校準狀態"
    ha: { type: "sensor", entity_category: "diagnostic" }

  # ================= 均衡核心觀測區 =================
  - key: "balance_current"
    name: "均衡電流"
    unit: "mA"
    ha: { type: "sensor", icon: "mdi:scale-balance", state_class: "measurement", entity_category: "diagnostic" }
  - key: "balance_action"
    name: "均衡動作模式"
    ha: { type: "sensor", icon: "mdi:hammer-wrench", entity_category: "diagnostic" }

  # ================= 動態估算與統計 =================
  - key: "actual_capacity_ah"
    name: "電池實際容量 (SOH)"
    unit: "Ah"
    ha: { type: "sensor", state_class: "measurement", suggested_display_precision: 3 }
  - key: "cycle_count"
    name: "循環次數"
    unit: "N"
    ha: { type: "sensor", icon: "mdi:battery-sync", state_class: "total_increasing" }
  - key: "total_cycle_capacity"
    name: "循環總容量"
    unit: "Ah"
    ha: { type: "sensor", state_class: "total_increasing", suggested_display_precision: 3 }
  - key: "runtime_seconds"
    name: "運行總時間"
    unit: "s"   # ⚠ HA 的 device_class: duration 只接受小寫 s / min / h / d，大寫 S 會被判為無效實體
    ha: { type: "sensor", device_class: "duration", state_class: "total_increasing" }

  # ================= 溫度監控 =================
  - key: "power_board_temp"
    name: "功率板(MOS)溫度"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }
  - key: "temp_sensor_1"
    name: "電池溫度 1"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }
  - key: "temp_sensor_2"
    name: "電池溫度 2"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }
  - key: "temp_sensor_3"
    name: "電池溫度 3"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }
  - key: "temp_sensor_4"
    name: "電池溫度 4"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }
  - key: "temp_sensor_5"
    name: "電池溫度 5"
    unit: "°C"
    ha: { type: "sensor", device_class: "temperature", state_class: "measurement", suggested_display_precision: 1 }

  # ================= 控制行為審計監聽 (0x10 Master Command) =================
  # ⚠ 以下三項來自 0x10 主控指令幀，只有當「別的主站對 BMS 下寫入指令」時才會出現。
  #   純旁路監聽 (mode: listen) 現場沒有主站在寫，adapter 永遠不會產出這三個 key，
  #   實體會恆為「未知」。故予以註解保留 —— 若日後改為主動模式或現場加入其他主站，
  #   直接取消註解即可恢復（adapter 的 BMS_MAP 0x10 區塊仍完整保留，無須改動）。
  # - key: "target_slave_id"
  #   name: "操作目標從機ID"
  #   ha: { type: "sensor", icon: "mdi:target-variant", entity_category: "diagnostic" }
  # - key: "register"
  #   name: "操作寄存器"
  #   ha: { type: "sensor", icon: "mdi:memory", entity_category: "diagnostic" }
  # - key: "value_hex"
  #   name: "指令數值"
  #   ha: { type: "sensor", icon: "mdi:numeric", entity_category: "diagnostic" }

  # ================= 單體電壓監控 (強制隔離至診斷區) =================
