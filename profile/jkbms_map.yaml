    unit: "°C"
    ha: { value_template: "{{ value_json.mos_otp }}", type: "sensor", suggested_display_precision: 1, entity_category: "diagnostic" }
  - key: "re_mos_otp_recovery"
    name: "MOS過溫恢復值"
    unit: "°C"
    ha: { value_template: "{{ value_json.mos_otp_recovery }}", type: "sensor", suggested_display_precision: 1, entity_category: "diagnostic" }

  # ================= 4. 保護延遲與解除設定閾值 (Thresholds) =================
  - key: "re_charge_ocp_delay"
    name: "充電過流保護延遲"
    unit: "S"
    ha: { value_template: "{{ value_json.charge_ocp_delay }}", type: "sensor", entity_category: "diagnostic" }
  - key: "re_charge_ocp_release"
    name: "充電過流保護解除"
    unit: "S"
    ha: { value_template: "{{ value_json.charge_ocp_release }}", type: "sensor", entity_category: "diagnostic" }
  - key: "re_discharge_ocp_delay"
    name: "放電過流保護延遲"
    unit: "S"
    ha: { value_template: "{{ value_json.discharge_ocp_delay }}", type: "sensor", entity_category: "diagnostic" }
  - key: "re_discharge_ocp_release"
