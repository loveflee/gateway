  - key: "alarm_bits_1"
    name: "原始告警遮罩"
    unit: "Hex"
    ha: { type: "sensor", icon: "mdi:bug-outline", entity_category: "diagnostic" }
  - key: "design_capacity"
    name: "電池設計容量"
    unit: "mAh"
    ha: { type: "sensor", icon: "mdi:battery-heart-outline", state_class: "measurement", entity_category: "diagnostic" }

B2_SETTING:
  # ================= 1. 電壓保護參數 (純監聽回讀，全數診斷類別) =================
  - key: "re_sleep_voltage"
    name: "休眠電壓設定"
    unit: "V"
    ha: { value_template: "{{ value_json.sleep_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_cell_uvp"
    name: "單體欠壓保護"
    unit: "V"
    ha: { value_template: "{{ value_json.cell_uvp }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_cell_uvp_recovery"
    name: "單體欠壓恢復"
    unit: "V"
    ha: { value_template: "{{ value_json.cell_uvp_recovery }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_cell_ovp"
    name: "單體過充保護"
    unit: "V"
    ha: { value_template: "{{ value_json.cell_ovp }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_cell_ovp_recovery"
    name: "單體過充恢復"
    unit: "V"
    ha: { value_template: "{{ value_json.cell_ovp_recovery }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_balance_trigger_diff"
    name: "觸發均衡壓差"
    unit: "V"
    ha: { value_template: "{{ value_json.balance_trigger_diff }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_soc_100_voltage"
    name: "SOC-100%基準電壓"
    unit: "V"
    ha: { value_template: "{{ value_json.soc_100_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_soc_0_voltage"
    name: "SOC-0%基準電壓"
    unit: "V"
    ha: { value_template: "{{ value_json.soc_0_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_rec_charge_voltage"
    name: "推薦充電電壓"
    unit: "V"
    ha: { value_template: "{{ value_json.rec_charge_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_float_charge_voltage"
    name: "浮充電壓設定"
    unit: "V"
    ha: { value_template: "{{ value_json.float_charge_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_auto_shutdown_voltage"
    name: "自動關機電壓"
    unit: "V"
    ha: { value_template: "{{ value_json.auto_shutdown_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }
  - key: "re_balance_start_voltage"
    name: "均衡起始電壓"
    unit: "V"
    ha: { value_template: "{{ value_json.balance_start_voltage }}", type: "sensor", suggested_display_precision: 3, entity_category: "diagnostic" }

  # ================= 2. 電流與開關設定 =================
  - key: "re_cont_charge_current"
    name: "最大充電電流設定"
    unit: "A"
    ha: { value_template: "{{ value_json.cont_charge_current }}", type: "sensor", suggested_display_precision: 1, entity_category: "diagnostic" }
  - key: "re_cont_discharge_current"
    name: "最大放電電流設定"
    unit: "A"
    ha: { value_template: "{{ value_json.cont_discharge_current }}", type: "sensor", suggested_display_precision: 1, entity_category: "diagnostic" }
  - key: "re_max_balance_current"
    name: "最大均衡電流設定"
    unit: "mA"
    ha: { value_template: "{{ value_json.max_balance_current }}", type: "sensor", entity_category: "diagnostic" }
  - key: "re_charge_switch"
    name: "充電開關(人為設定)"
    ha: { value_template: "{{ value_json.charge_switch }}", type: "binary_sensor", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }
  - key: "re_discharge_switch"
    name: "放電開關(人為設定)"
    ha: { value_template: "{{ value_json.discharge_switch }}", type: "binary_sensor", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }
  - key: "re_balance_switch"
    name: "均衡開關(人為設定)"
    ha: { value_template: "{{ value_json.balance_switch }}", type: "binary_sensor", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }

