  - key: "cell_09_voltage"
    name: "單體 09 電壓"
    unit: "V"
    ha: { type: "sensor", device_class: "voltage", state_class: "measurement", suggested_display_precision: 3 }
  - key: "cell_10_voltage"
    name: "單體 10 電壓"
    unit: "V"
    ha: { type: "sensor", device_class: "voltage", state_class: "measurement", suggested_display_precision: 3 }
  - key: "cell_11_voltage"
