    ha: { value_template: "{{ value_json.smart_sleep_time }}", type: "sensor", entity_category: "diagnostic" }
  - key: "emergency_switch_time"
    name: "應急開關計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }
  - key: "sleep_time_seconds"
    name: "進入休眠倒計時"
    unit: "S"
    ha: { type: "sensor", entity_category: "diagnostic" }

  # ================= 7. 物理封存欄位 =================
  - key: "device_address"
    name: "設備物理位址"
    ha: { type: "sensor", enabled_by_default: false, entity_category: "diagnostic" }

B3_STATUS_BITS:
  # ================= 全局硬體保護告警 (Alarms - 必補) =================
  - key: "cell_ovp_alarm"
    name: "單體過壓保護 (OVP)"
    ha: { type: "binary_sensor", device_class: "problem", payload_on: "ON", payload_off: "OFF", entity_category: "diagnostic" }
